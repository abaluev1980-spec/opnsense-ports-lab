name: Build - sudo

on:
  workflow_dispatch:

jobs:
  build-sudo:
    runs-on: ubuntu-latest
    name: Build sudo port inside OPNsense VM

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OPNsense VM and build sudo
        uses: vmactions/opnsense-vm@v1
        with:
          debug-on-error: true
          sync: nfs
          prepare: |
            pkg install -y git
          run: |
            set -e
            cd /usr
            git clone https://github.com/opnsense/tools
            cd tools
            make update
            make ports PORTSLIST="security/sudo"

            echo ">>> Ищем собранные пакеты и копируем в синхронизированную папку dist/"
            mkdir -p dist
            find /usr -name "*.pkg" -exec cp {} dist/ \;
            
            echo ">>> Содержимое dist:"
            ls -lh dist/
            
            if [ -z "$(ls -A dist/)" ]; then
              echo "ОШИБКА: Не найдено ни одного .pkg файла!"
              exit 1
            fi

      - name: Upload built sudo package
        uses: actions/upload-artifact@v4
        with:
          name: opnsense-sudo-package
          path: dist/*.pkg
          if-no-files-found: error
