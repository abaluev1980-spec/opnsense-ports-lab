name: Build - sudo

on:
  workflow_dispatch:

jobs:
  build-sudo:
    runs-on: ubuntu-latest
    name: Build sudo port inside OPNsense VM

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OPNsense VM and build sudo
        uses: vmactions/opnsense-vm@v1
        with:
          debug-on-error: true
          sync: nfs
          prepare: |
            pkg install -y git
          run: |
            set -e
            echo ">>> Клонируем официальные инструменты сборки OPNsense"
            cd /usr
            git clone https://github.com/opnsense/tools
            
            echo ">>> Обновляем дерево портов"
            cd tools
            make update
            
            echo ">>> Собираем порт security/sudo"
            make ports PORTSLIST="security/sudo"

            echo ">>> Ищем собранные пакеты по всей системе"
            mkdir -p /tmp/artifacts
            find /usr -name "*.pkg" -exec cp {} /tmp/artifacts/ \;
            
            echo ">>> Содержимое /tmp/artifacts:"
            ls -lh /tmp/artifacts/
            
            if [ -z "$(ls -A /tmp/artifacts/)" ]; then
              echo "ОШИБКА: Не найдено ни одного .pkg файла!"
              exit 1
            fi

      - name: Upload built sudo package
        uses: actions/upload-artifact@v4
        with:
          name: opnsense-sudo-package
          path: /tmp/artifacts/*.pkg
          if-no-files-found: error
