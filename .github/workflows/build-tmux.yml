name: Build - tmux

on:
  workflow_dispatch:

jobs:
  build-tmux:
    runs-on: ubuntu-latest
    name: Build tmux port inside OPNsense VM

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OPNsense VM and build tmux
        uses: vmactions/opnsense-vm@v1
        with:
          debug-on-error: true
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y git
          run: |
            set -e
            WORKSPACE=$(pwd)
            cd /usr
            git clone https://github.com/opnsense/tools
            cd tools
            make update
            make ports PORTSLIST="sysutils/tmux"

            echo ">>> Копируем .pkg в рабочую директорию для синхронизации"
            mkdir -p "$WORKSPACE/dist"
            find /usr -name "*.pkg" -exec cp {} "$WORKSPACE/dist/" \;
            ls -lh "$WORKSPACE/dist/"

            if [ -z "$(ls -A "$WORKSPACE/dist/")" ]; then
              echo "ОШИБКА: Не найдено ни одного .pkg файла!"
              exit 1
            fi

      - name: Upload built tmux package
        uses: actions/upload-artifact@v4
        with:
          name: opnsense-tmux-package
          path: dist/*.pkg
          if-no-files-found: error
